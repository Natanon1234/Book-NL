name: Book build and package

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: book-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  formatting:
    name: LaTeX source formatting
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check changed LaTeX formatting
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || 'main' }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          python3 scripts/check_tex_formatting.py --base "origin/$BASE_REF"

  build:
    name: Compile book and export package
    needs: formatting
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out source and Git LFS assets
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install TeX Live, fonts, and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            biber \
            fonts-noto-core \
            fonts-noto-extra \
            fonts-noto-ui-core \
            latexmk \
            texlive-bibtex-extra \
            texlive-fonts-extra \
            texlive-fonts-recommended \
            texlive-lang-other \
            texlive-latex-extra \
            texlive-pictures \
            texlive-science \
            texlive-xetex \
            unzip \
            zip
          sudo fc-cache --force --verbose

      - name: Verify required system fonts
        run: |
          fc-match -f '%{family}\n' "Noto Sans Condensed" | grep -qi "Noto Sans Condensed"
          fc-match -f '%{family}\n' "Noto Sans Thai UI" | grep -qi "Noto Sans Thai UI"
          kpsewhich lmmono10-regular.otf
          kpsewhich latinmodern-math.otf

      - name: Compile and package every book unit
        run: bash scripts/build_book.sh

      - name: Upload PDF and ZIP build package
        uses: actions/upload-artifact@v4
        with:
          name: book-nl-build-package
          path: |
            dist/Book-NL.pdf
            dist/Book-NL-chapters-and-appendices.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
